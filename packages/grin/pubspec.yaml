name: grin
description: The backend-neutral Grin wallet API. Wallet and backend interfaces, models, exceptions, units and events, in pure Dart. Apps depend on a backend package such as grin_native, which re-exports this one.
version: 0.1.0
repository: https://github.com/cypherstack/grin
# Not published. The maintainers decide when and where once the plugin has
# been reviewed; never publish from a working tree.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
