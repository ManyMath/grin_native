[package]
name = "grin-ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "C ABI over grin-wallet for package:grin_native"
license = "Apache-2.0"
# include/grin_ffi.h is the committed C header. build.rs regenerates it only
# when GRIN_FFI_WRITE_HEADER=1 is set; tests/header_test.rs checks it.
include = ["Cargo.toml", "build.rs", "cbindgen.toml", "include/**", "src/**", "tests/**"]

[lib]
name = "grin_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = []
# Exports grin_test_panic, grin_test_create_wallet and grin_test_mine_blocks
# (an in-process chain via impls::test_framework). Never in release builds;
# the nm gate checks that.
test-utils = []

[dependencies]
grin_wallet_impls = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662", default-features = false, features = ["rustls"] }
grin_wallet_libwallet = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662" }
grin_wallet_config = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662" }
grin_wallet_util = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662" }
grin_core = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662" }
grin_keychain = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662" }
grin_chain = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662" }
grin_store = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662" }
grin_util = { git = "https://github.com/cypherstack/grin_native.git", rev = "f15ae2e3a3ae1a426a4ad45ecb1142a8ba295662" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Same major versions the fork already uses, so nothing is duplicated
# (libwallet's slate ids are uuid 1).
uuid = { version = "1", features = ["serde", "v4"] }
rand = "0.6"
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cbindgen = "0.29"

# A single-crate workspace: keeps cargo from looking for a parent workspace
# above packages/grin_native/rust.
[workspace]

[profile.release]
# Explicit so reproducibility does not depend on toolchain defaults.
debug = false
strip = "debuginfo"
incremental = false
