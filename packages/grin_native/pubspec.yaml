name: grin_native
description: A Grin wallet API and native backend built over the grin-ffi Rust library.
version: 0.1.0
repository: https://github.com/cypherstack/grin_native
# Not published. The maintainers decide when and where once the plugin has
# been reviewed; never publish from a working tree.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  code_assets: ^1.2.1
  ffi: ^2.1.0
  hooks: ^2.2.0
  meta: ^1.16.0
  # hook/build.dart builds rust/ with RustBuilder. Pinned together with
  # code_assets ^1.2.1 (1.0.7 moves to code_assets ^2).
  native_toolchain_rust: 1.0.6

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.26.0
