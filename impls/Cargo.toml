[package]
name = "grin_wallet_impls"
version = "5.5.1"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Concrete types derived from libwallet traits"
license = "Apache-2.0"
repository = "https://github.com/mimblewimble/grin-wallet"
keywords = [ "crypto", "grin", "mimblewimble" ]
exclude = ["**/*.grin", "**/*.grin2"]
edition = "2021"

[features]
default = ["tor", "native-tls"]
# One TLS backend is required. If both are enabled, native-tls is used.
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-no-provider", "dep:rustls", "dep:webpki-roots"]
tor = [
	"dep:ed25519-dalek",
	"dep:regex",
	"dep:timer",
	"dep:sysinfo",
	"dep:base64",
	"dep:url",
	"dep:arti-client",
	"dep:tor-rtcompat",
	"dep:fs-mistrust",
	"dep:fslock-guard",
	"dep:tor-hsservice",
	"dep:tor-hsrproxy",
	"dep:tor-keymgr",
	"dep:tor-llcrypto",
	"dep:tor-hscrypto",
	"dep:sha2",
	"dep:hyper",
	"dep:hyper-util",
	"dep:http-body-util",
	"dep:bytes",
]

[dependencies]
blake2-rfc = "0.2"
thiserror = "1"
futures = "0.3"
rand = "0.6"
serde = "1"
serde_derive = "1"
serde_json = "1"
log = "0.4"
ring = "0.17.14"
chrono = { version = "0.4.11", features = ["serde"] }
lazy_static = "1"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["socks", "system-proxy", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0", optional = true }
zeroize = "1"

#Socks/Tor/Bridge/Proxy
ed25519-dalek = { version = "2", optional = true }
regex = { version = "1.3", optional = true }
timer = { version = "0.2", optional = true }
sysinfo = { version = "0.29", optional = true }
base64 = { version = "0.12.0", optional = true }
url = { version = "2.1", optional = true }

arti-client = { version = "0.43.0", features = ["static", "pt-client", "onion-service-service", "onion-service-client"], optional = true }
tor-rtcompat = { version = "0.43.0", features = ["static"], optional = true }
fs-mistrust = { version = "0.14.2", optional = true }
fslock-guard = { version = "0.8", optional = true }
tor-hsservice = { version = "0.43.0", optional = true }
tor-hsrproxy = { version = "0.43.0", optional = true }
tor-keymgr = { version = "0.43.0", optional = true }
tor-llcrypto = { version = "0.43.0", optional = true }
tor-hscrypto = { version = "0.43.0", optional = true }
sha2 = { version = "0.10.8", optional = true }
hyper = { version = "1.10.1", features = ["http1", "client"], optional = true }
hyper-util = { version = "0.1.20", features = ["tokio"], optional = true }
http-body-util = { version = "0.1.3", optional = true }
bytes = { version = "1.11.1", optional = true }

grin_wallet_util = { path = "../util", version = "5.5.1" }
grin_wallet_config = { path = "../config", version = "5.5.1" }
grin_wallet_libwallet = { path = "../libwallet", version = "5.5.1" }

##### Grin Imports

grin_core = { path = "../grin/core"}
grin_keychain = { path = "../grin/keychain"}
grin_chain = { path = "../grin/chain"}
grin_util = { path = "../grin/util"}
grin_api = { path = "../grin/api"}

#####